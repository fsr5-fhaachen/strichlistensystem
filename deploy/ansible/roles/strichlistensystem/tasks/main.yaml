- name: clone repository
  ansible.builtin.git:
    repo: "{{ strichlistensystem_repo_url }}"
    dest: "{{ strichlistensystem_local_path }}"
    version: "{{ strichlistensystem_branch_or_tag }}"
    force: yes
    update: yes
- name: create .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ strichlistensystem_local_path }}/.env"
    owner: www-data
    group: www-data
    mode: "0644"
- name: install php dependencies
  ansible.builtin.shell:
    cmd: composer install --no-dev --optimize-autoloader
    chdir: "{{ strichlistensystem_local_path }}"
  environment:
    COMPOSER_ALLOW_SUPERUSER: "1"
- name: install node dependencies
  ansible.builtin.shell:
    cmd: npm install
    chdir: "{{ strichlistensystem_local_path }}"
- name: build frontend
  ansible.builtin.shell:
    cmd: npm run build
    chdir: "{{ strichlistensystem_local_path }}"
- name: migrate database
  ansible.builtin.shell:
    cmd: php artisan migrate
    chdir: "{{ strichlistensystem_local_path }}"
- name: seed database
  ansible.builtin.shell:
    cmd: php artisan db:seed
    chdir: "{{ strichlistensystem_local_path }}"
  when: strichlistensystem_seed_database | default(false)
- name: create systemd unit
  ansible.builtin.template:
    src: octane.service.j2
    dest: /etc/systemd/system/octane.service
    mode: "0644"
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
- name: enable and restart octane service
  ansible.builtin.systemd:
    name: octane.service
    enabled: yes
    state: restarted
